name: Feature request
description: Suggest a focused, testable improvement
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety and rollback considerations
      description: Explain what could change and how it would be restored.
