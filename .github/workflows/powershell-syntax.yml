name: PowerShell Syntax Check

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse KXM engine with Windows PowerShell 5.1
        shell: powershell
        run: |
          $files = Get-ChildItem -Path . -Filter '*.ps1' -File -Recurse
          $failed = $false
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "SYNTAX FAIL: $($file.FullName)" -ForegroundColor Red
              foreach ($err in $errors) {
                Write-Host "Line $($err.Extent.StartLineNumber): $($err.Message)" -ForegroundColor Red
              }
            } else {
              Write-Host "SYNTAX PASS: $($file.FullName)" -ForegroundColor Green
            }
          }
          if ($failed) { exit 1 }
